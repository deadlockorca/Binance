[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-engine"
version = "0.1.0"
description = "Binance USDT-M trading engine for demo/live trading"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "ccxt>=4.4.84",
  "pandas>=2.2.0",
  "pyyaml>=6.0.1",
  "python-dotenv>=1.0.1",
  "websocket-client>=1.8.0",
]

[project.scripts]
aegis-engine = "aegis_engine.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
